spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties],optional:file:ResumeBuilder-Backend/.env[.properties]"
  application:
    name: gateway-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        enabled: ${ADMIN_CLIENT_ENABLED:false}
        instance:
          prefer-ip: true
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:3001"
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "${FRONTEND_URL:http://localhost:3000}"
            allowed-methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
            allowed-headers: ["*"]
            allow-credentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-ResumeAI-Gateway, gateway-service
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            methods: GET
            backoff:
              firstBackoff: 500ms
              maxBackoff: 3s
              factor: 2
              basedOnPreviousValue: false

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service
                fallbackUri: forward:/fallback/auth-service

        - id: auth-oauth-service
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**,/login/oauth2/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-oauth-service
                fallbackUri: forward:/fallback/auth-service

        - id: resume-service
          uri: lb://resume-service
          predicates:
            - Path=/api/v1/resumes/**
          filters:
            - name: CircuitBreaker
              args:
                name: resume-service
                fallbackUri: forward:/fallback/resume-service

        - id: section-service
          uri: lb://section-service
          predicates:
            - Path=/api/v1/sections/**
          filters:
            - name: CircuitBreaker
              args:
                name: section-service
                fallbackUri: forward:/fallback/section-service

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: CircuitBreaker
              args:
                name: ai-service
                fallbackUri: forward:/fallback/ai-service

        - id: template-service
          uri: lb://template-service
          predicates:
            - Path=/api/v1/templates/**
          filters:
            - name: CircuitBreaker
              args:
                name: template-service
                fallbackUri: forward:/fallback/template-service

        - id: export-service
          uri: lb://export-service
          predicates:
            - Path=/api/v1/exports/**
          filters:
            - name: CircuitBreaker
              args:
                name: export-service
                fallbackUri: forward:/fallback/export-service

        - id: jobmatch-service
          uri: lb://jobmatch-service
          predicates:
            - Path=/api/v1/job-matches/**
          filters:
            - name: CircuitBreaker
              args:
                name: jobmatch-service
                fallbackUri: forward:/fallback/jobmatch-service

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notification-service
                fallbackUri: forward:/fallback/notification-service

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback/payment-service

        - id: resumeai-web
          uri: lb://resumeai-web
          predicates:
            - Path=/api/v1/web/**
          filters:
            - name: CircuitBreaker
              args:
                name: resumeai-web
                fallbackUri: forward:/fallback/resumeai-web

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    configs:
      default:
        timeoutDuration: 20s
        cancelRunningFuture: true
    instances:
      auth-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      auth-oauth-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.boot.autoconfigure: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
