spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties],optional:file:ResumeBuilder-Backend/.env[.properties]"
  application:
    name: notification-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        enabled: ${ADMIN_CLIENT_ENABLED:false}
        instance:
          prefer-ip: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${NOTIFICATION_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${NOTIFICATION_DB_MIN_IDLE:1}
      connection-timeout: ${NOTIFICATION_DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8088

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

app:
  notification:
    retention-hours: ${NOTIFICATION_RETENTION_HOURS:720}
    cleanup-cron: ${NOTIFICATION_CLEANUP_CRON:0 0 3 * * *}
    stream-timeout-millis: ${NOTIFICATION_STREAM_TIMEOUT_MS:1800000}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@resumeai.local}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://auth-service}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
