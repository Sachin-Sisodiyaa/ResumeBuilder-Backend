spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties],optional:file:ResumeBuilder-Backend/.env[.properties]"
  application:
    name: resumeai-web
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        enabled: ${ADMIN_CLIENT_ENABLED:false}
        instance:
          prefer-ip: true
server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

app:
  services:
    auth: ${AUTH_SERVICE_URL:http://auth-service}
    resume: ${RESUME_SERVICE_URL:http://resume-service}
    section: ${SECTION_SERVICE_URL:http://section-service}
    ai: ${AI_SERVICE_URL:http://ai-service}
    template: ${TEMPLATE_SERVICE_URL:http://template-service}
    export: ${EXPORT_SERVICE_URL:http://export-service}
    jobmatch: ${JOBMATCH_SERVICE_URL:http://jobmatch-service}
    notification: ${NOTIFICATION_SERVICE_URL:http://notification-service}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
