      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL=http://resume-service:8082/actuator
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL=http://resume-service:8082/actuator/health
    depends_on:
