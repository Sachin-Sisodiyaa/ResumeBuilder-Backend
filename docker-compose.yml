version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: resumeai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: resumeai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build:
      context: .
      args:
        MODULE: gateway-service
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - RESUME_SERVICE_URL=http://resume-service:8082
      - SECTION_SERVICE_URL=http://section-service:8083
      - AI_SERVICE_URL=http://ai-service:8084
      - TEMPLATE_SERVICE_URL=http://template-service:8085
      - EXPORT_SERVICE_URL=http://export-service:8086
      - JOBMATCH_SERVICE_URL=http://jobmatch-service:8087
      - NOTIFICATION_SERVICE_URL=http://notification-service:8088
      - PAYMENT_SERVICE_URL=http://payment-service:8089
      - WEB_SERVICE_URL=http://resumeai-web:8091
    depends_on:
      - auth-service

  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_SERVICE_URL=http://notification-service:8088

  resume-service:
    build:
      context: .
      args:
        MODULE: resume-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_resume?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq

  section-service:
    build:
      context: .
      args:
        MODULE: section-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_section?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq

  ai-service:
    build:
      context: .
      args:
        MODULE: ai-service
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_SERVICE_URL=http://notification-service:8088

  template-service:
    build:
      context: .
      args:
        MODULE: template-service
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_template?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq

  export-service:
    build:
      context: .
      args:
        MODULE: export-service
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_export?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_SERVICE_URL=http://notification-service:8088
    depends_on:
      - rabbitmq
      - redis

  jobmatch-service:
    build:
      context: .
      args:
        MODULE: jobmatch-service
    ports:
      - "8087:8087"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_jobmatch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_SERVICE_URL=http://notification-service:8088

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://host.docker.internal:3306/resumeai_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq

  resumeai-web:
    build:
      context: .
      args:
        MODULE: resumeai-web
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      - APP_SERVICES_AUTH=http://auth-service:8081
      - APP_SERVICES_RESUME=http://resume-service:8082
      - APP_SERVICES_SECTION=http://section-service:8083
      - APP_SERVICES_AI=http://ai-service:8084
      - APP_SERVICES_TEMPLATE=http://template-service:8085
      - APP_SERVICES_EXPORT=http://export-service:8086
      - APP_SERVICES_JOBMATCH=http://jobmatch-service:8087
      - APP_SERVICES_NOTIFICATION=http://notification-service:8088
    depends_on:
      - auth-service
      - resume-service
      - ai-service
      - template-service
      - notification-service

volumes:
  redis-data:
