services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: resumeai-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: resumeai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  discovery-service:
    build:
      context: .
      args:
        MODULE: discovery-service
    ports:
      - "8761:8761"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ADMIN_SERVER_URL=http://admin-service:9090
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  admin-service:
    build:
      context: .
      args:
        MODULE: admin-service
    ports:
      - "9090:9090"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway-service:
    build:
      context: .
      args:
        MODULE: gateway-service
    ports:
      - "8090:8090"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
      - ADMIN_SERVER_URL=http://admin-service:9090
      - ADMIN_CLIENT_ENABLED=true
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://gateway-service:8090
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL=http://gateway-service:8090/actuator
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL=http://gateway-service:8090/actuator/health
    depends_on:
      discovery-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      section-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      template-service:
        condition: service_healthy
      export-service:
        condition: service_healthy
      jobmatch-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      resumeai-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 45s

  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    ports:
      - "8081:8081"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://yamanote.proxy.rlwy.net:58560/resumeai_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-18052004}
      - HIBERNATE_DDL_AUTO=update
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_SERVICE_URL=http://notification-service
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
      - ADMIN_SERVER_URL=http://admin-service:9090
      - ADMIN_CLIENT_ENABLED=true
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://auth-service:8081
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL=http://auth-service:8081/actuator
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL=http://auth-service:8081/actuator/health
    depends_on:
      discovery-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
